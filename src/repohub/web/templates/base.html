<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}RepoHub{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">🌌 RepoHub</a>
  <form action="/search" method="get" class="searchbar">
    <input name="q" value="{{ q | default('') }}" placeholder="Search repositories" aria-label="Search" autofocus>
    <input name="language" value="{{ form.language | default('') }}" placeholder="language" aria-label="Language" size="9">
    <input name="min_stars" type="number" min="0" value="{{ form.min_stars if form and form.min_stars else '' }}" placeholder="min ★" aria-label="Minimum stars" title="Minimum stars" class="num">
    <input name="days" type="number" min="0" value="{{ form.days if form and form.days else '' }}" placeholder="days" aria-label="Updated within days" title="Updated within N days (empty = any)" class="num">
    <select name="host" aria-label="Host">
      {% set cur = "all" if not form or not form.host or form.host == "both" else form.host %}
      {% for h in host_ids %}<option value="{{ h }}" {% if cur == h %}selected{% endif %}>{{ h }}</option>{% endfor %}
    </select>
    <label><input type="checkbox" name="archived" value="1" {% if form and form.archived %}checked{% endif %}> archived</label>
    <select name="sort" aria-label="Sort by">
      {% for s in ["stars", "updated", "forks"] %}<option value="{{ s }}" {% if (form.sort if form and form.sort else "stars") == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>
    <label><input type="checkbox" name="hide_forks" value="1" {% if form and form.hide_forks %}checked{% endif %}> hide forks</label>
    <button>Search</button>
  </form>
  <nav><a href="/favorites">★ Favorites</a></nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
